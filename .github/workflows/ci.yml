name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by the deploy workflow
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devmatch
          POSTGRES_PASSWORD: devmatch
          POSTGRES_DB: devmatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devmatch" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://devmatch:devmatch@localhost:5432/devmatch
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Docker build
        run: docker build -t devmatch-api:ci .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  lambda:
    name: Lambda tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/image-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lambda/image-processor/package-lock.json
      - run: npm ci
      - run: npm test

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive infra
      - name: Validate main stack
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
